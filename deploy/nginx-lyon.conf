# =====================================================================
#  Carte "Biens dormants Lyon" — configuration nginx pour VPS
#  À placer dans /etc/nginx/sites-available/lyon puis activer via :
#    ln -s /etc/nginx/sites-available/lyon /etc/nginx/sites-enabled/lyon
#    rm -f /etc/nginx/sites-enabled/default
#    nginx -t && systemctl reload nginx
# =====================================================================

# Cache des réponses d'API (évite de retélécharger DVF à chaque visiteur)
proxy_cache_path /var/cache/nginx/lyon levels=1:2 keys_zone=lyon_api:20m
                 max_size=2g inactive=7d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;

    # Remplacez par votre domaine, ou laissez "_" pour servir sur l'IP nue
    server_name _;

    root /var/www/lyon;
    index lyon.html index.html;

    # ---- Site statique ----
    location / {
        try_files $uri $uri/ /lyon.html;
    }

    gzip on;
    # text/html est toujours compressé par nginx : ne pas le relister (warn "duplicate MIME type")
    gzip_types text/css application/javascript application/json application/geo+json;
    gzip_min_length 1024;

    # ---- Sonde détectée par le front pour activer le mode proxy ----
    location = /api/health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ---- Reverse-proxy vers les APIs publiques (supprime les soucis CORS) ----
    # Réglages communs
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # Cadastre IGN Géoplateforme (WFS)
    location /api/geopf/ {
        proxy_pass              https://data.geopf.fr/;
        proxy_set_header        Host data.geopf.fr;
        proxy_ssl_server_name   on;
        proxy_http_version      1.1;
        proxy_cache             lyon_api;
        proxy_cache_valid       200 12h;
        proxy_cache_key         $scheme$request_method$host$request_uri;
        add_header              X-Cache $upstream_cache_status;
        proxy_connect_timeout   15s;
        proxy_read_timeout      60s;
    }

    # DVF — Demandes de Valeurs Foncières (Etalab). Gros fichiers -> cache long.
    location /api/dvf/ {
        proxy_pass              https://files.data.gouv.fr/;
        proxy_set_header        Host files.data.gouv.fr;
        proxy_ssl_server_name   on;
        proxy_http_version      1.1;
        proxy_cache             lyon_api;
        proxy_cache_valid       200 7d;
        proxy_cache_valid       404 10m;
        proxy_cache_key         $scheme$request_method$host$request_uri;
        add_header              X-Cache $upstream_cache_status;
        proxy_connect_timeout   15s;
        proxy_read_timeout      300s;
    }

    # BAN — Base Adresse Nationale (géocodage)
    location /api/ban/ {
        proxy_pass              https://api-adresse.data.gouv.fr/;
        proxy_set_header        Host api-adresse.data.gouv.fr;
        proxy_ssl_server_name   on;
        proxy_http_version      1.1;
        proxy_cache             lyon_api;
        proxy_cache_valid       200 1d;
        proxy_cache_key         $scheme$request_method$host$request_uri;
        proxy_connect_timeout   10s;
        proxy_read_timeout      30s;
    }
}
